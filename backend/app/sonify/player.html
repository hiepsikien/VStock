<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC streaming</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12140f;
      --ink: #f4f1e8;
      --muted: #b7b1a4;
      --line: #2a2e26;
      --accent: #e6ff4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    h1 {
      font-size: 32px;
      font-weight: 500;
      margin: 0 0 8px;
    }
    p { color: var(--muted); margin: 0 0 28px; }
    .kicker {
      margin: 0 0 8px;
      color: var(--muted);
      font: 12px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .variants { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font: 600 16px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 14px 22px;
      border-radius: 999px;
      cursor: pointer;
      border-color: var(--line);
    }
    button.active {
      background: var(--accent);
      color: #16180f;
      border-color: var(--accent);
    }
    .readout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0 16px;
    }
    .readout div {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .readout span {
      display: block;
      color: var(--muted);
      font: 12px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .readout strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      font-weight: 500;
    }
    canvas {
      width: 100%;
      height: 160px;
      background: #0d0f0c;
      border-radius: 12px;
      display: block;
    }
    #status {
      margin-top: 14px;
      color: var(--muted);
      font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <h1>BTC, bốn nốt mỗi giây</h1>
    <p>Lịch sử phát lại đoạn BTCUSDT khoảng 90 giây. Nghe thật lấy từng lệnh đang khớp trên Binance và chạy tiếp khi lệnh mới tới. Mỗi ô 250 ms là một nốt. Đổi cách phối là nghe lại từ đầu.</p>
    <p class="kicker">Nguồn</p>
    <div class="variants" id="sources">
      <button type="button" data-source="history" class="active">Lịch sử</button>
      <button type="button" data-source="live">Nghe thật</button>
    </div>
    <p class="kicker">Phối</p>
    <div class="variants">
      <button type="button" data-variant="symphony">Symphony</button>
      <button type="button" data-variant="jazz">Jazz</button>
      <button type="button" data-variant="minimalist">Minimalist</button>
    </div>
    <div class="readout">
      <div><span>Giá</span><strong id="price">—</strong></div>
      <div><span>Hợp âm</span><strong id="chord">—</strong></div>
      <div><span>Regime</span><strong id="regime">—</strong></div>
    </div>
    <canvas id="roll" width="720" height="160"></canvas>
    <div id="status">Chưa phát.</div>
  </main>
  <script>
    const buttons = [...document.querySelectorAll("[data-variant]")];
    const sourceButtons = [...document.querySelectorAll("[data-source]")];
    const priceEl = document.querySelector("#price");
    const chordEl = document.querySelector("#chord");
    const regimeEl = document.querySelector("#regime");
    const statusEl = document.querySelector("#status");
    const canvas = document.querySelector("#roll");
    const ctx2d = canvas.getContext("2d");
    const recent = [];

    function draw() {
      const width = canvas.width;
      const height = canvas.height;
      ctx2d.clearRect(0, 0, width, height);
      ctx2d.strokeStyle = "#2a2e26";
      ctx2d.beginPath();
      ctx2d.moveTo(0, height / 2);
      ctx2d.lineTo(width, height / 2);
      ctx2d.stroke();
      if (!recent.length) return;
      const low = Math.min(...recent) - 2;
      const high = Math.max(...recent) + 2;
      const span = Math.max(1, high - low);
      const step = width / 64;
      ctx2d.strokeStyle = "#e6ff4d";
      ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      recent.forEach((midi, index) => {
        const x = width - (recent.length - index) * step;
        const y = height - ((midi - low) / span) * (height - 16) - 8;
        if (index === 0) ctx2d.moveTo(x, y);
        else ctx2d.lineTo(x, y);
      });
      ctx2d.stroke();
    }

    const ROLE_GAIN = {
      violin: 0.22, cello: 0.16, piano: 0.1, fill: 0.1, flute: 0.12,
      sax: 0.16, rhodes: 0.09, vibe: 0.11, bass: 0.34,
      arp: 0.14, pad: 0.07, pulse: 0.1, stab: 0.12, bell: 0.11,
    };
    let socket = null;
    let audio = null;
    let session = 0;

    function tone(ctx, master, midi, when, dur, velocity, type, role) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      const scale = ROLE_GAIN[role] || 0.12;
      const peak = Math.max(0.0008, (velocity / 127) * scale);
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(peak, when + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.05, dur));
      osc.connect(gain);
      gain.connect(master);
      osc.start(when);
      osc.stop(when + dur + 0.03);
    }

    function whenFor(origin, seq, step, swing) {
      if (!swing) return origin + seq * step;
      const beat = Math.floor(seq / 4);
      const pos = seq % 4;
      const beatStart = origin + beat * step * 4;
      const long = step * 4 * (2 / 3);
      const short = step * 4 - long;
      if (pos < 2) return beatStart + (pos * long) / 2;
      return beatStart + long + ((pos - 2) * short) / 2;
    }

    function currentSource() {
      const active = sourceButtons.find((button) => button.classList.contains("active"));
      return active ? active.dataset.source : "history";
    }

    async function start(variant) {
      const mine = ++session;
      const chosenSource = currentSource();
      if (socket) {
        socket.close();
        socket = null;
      }
      if (audio) {
        const previous = audio;
        audio = null;
        if (previous.state !== "closed") previous.close().catch(() => {});
      }
      if (mine !== session) return;
      buttons.forEach((button) => button.classList.toggle("active", button.dataset.variant === variant));
      recent.length = 0;
      draw();
      priceEl.textContent = "—";
      chordEl.textContent = "—";
      regimeEl.textContent = "—";
      const ctx = new AudioContext();
      audio = ctx;
      const master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
      try {
        await ctx.resume();
      } catch (err) {
        if (mine === session) statusEl.textContent = "Không mở được tiếng.";
        return;
      }
      if (mine !== session) return;
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const opened = new WebSocket(`${protocol}://${location.host}/v1/sonify/ws?variant=${variant}&source=${chosenSource}`);
      if (mine !== session) {
        opened.close();
        return;
      }
      socket = opened;
      let origin = null;
      let step = 0.25;
      let finished = false;
      let listening = chosenSource;
      statusEl.textContent = "Đang nối…";
      socket.addEventListener("message", (event) => {
        if (mine !== session) return;
        const msg = JSON.parse(event.data);
        if (msg.type === "hello") {
          step = msg.bucket_ms / 1000;
          listening = msg.source || listening;
          statusEl.textContent = listening === "live"
            ? `Nghe thật · ${msg.variant}.`
            : `Đoạn lịch sử · ${msg.variant}.`;
          return;
        }
        if (msg.type === "error") {
          finished = true;
          statusEl.textContent = msg.text || "Không nối được Binance.";
          return;
        }
        if (msg.type === "end") {
          finished = true;
          statusEl.textContent = listening === "live"
            ? "Dòng Binance đã dừng."
            : `Hết đoạn, ${msg.notes} nốt.`;
          socket.close();
          return;
        }
        if (msg.type !== "note") return;
        const now = ctx.currentTime;
        if (origin === null) origin = now + 0.3 - whenFor(0, msg.seq, step, msg.swing);
        let when = whenFor(origin, msg.seq, step, msg.swing);
        if (when < now + 0.02) {
          origin += now + 0.05 - when;
          when = now + 0.05;
        }
        for (const voice of msg.voices) {
          tone(ctx, master, voice.midi, when, voice.dur_ms / 1000, voice.velocity, voice.wave, voice.role);
        }
        priceEl.textContent = Number(msg.price).toLocaleString("en-US", { maximumFractionDigits: 2 });
        chordEl.textContent = msg.chord;
        regimeEl.textContent = msg.regime;
        recent.push(msg.midi);
        if (recent.length > 64) recent.shift();
        draw();
      });
      socket.addEventListener("close", () => {
        if (mine !== session || finished) return;
        statusEl.textContent = "Mất kết nối.";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => start(button.dataset.variant));
    });
    sourceButtons.forEach((button) => {
      button.addEventListener("click", () => {
        sourceButtons.forEach((item) => item.classList.toggle("active", item === button));
        const playing = buttons.find((item) => item.classList.contains("active"));
        if (playing) start(playing.dataset.variant);
      });
    });
  </script>
</body>
</html>
