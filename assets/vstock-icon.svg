<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="VStock">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="nodeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#FFC440"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#000000"/>
    <!-- AI neural links from V vertex (app yellow #F5A623) — no vertical crosshair, no grid -->
    <g stroke="#F5A623" stroke-width="3" opacity="0.78" fill="none">
      <line x1="225" y1="799" x2="553" y2="369"/>
      <line x1="225" y1="799" x2="737" y2="307"/>
      <line x1="225" y1="799" x2="942" y2="246"/>
    </g>
    <!-- Right-focused chart: V near left, rise to the right -->
    <polyline
      fill="none"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      points="61,635 143,717 225,799 348,532 450,410 553,369 635,471 737,307 839,389 942,246"
    />
    <g filter="url(#nodeGlow)">
      <circle cx="553" cy="369" r="17" fill="url(#nodeCore)"/>
      <circle cx="737" cy="307" r="17" fill="url(#nodeCore)"/>
      <circle cx="942" cy="246" r="17" fill="url(#nodeCore)"/>
      <circle cx="225" cy="799" r="39" fill="url(#nodeCore)"/>
    </g>
  </g>
</svg>
