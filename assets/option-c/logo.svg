<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="VStock — Stock × AI">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.19  0 0 0 0 0.82  0 0 0 0 0.35  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Neural hub (abstract brain) + rising market path -->
  <g fill="none" stroke="#0A84FF" stroke-width="11" stroke-linecap="round" filter="url(#glow)" opacity="0.95">
    <!-- hub synapses -->
    <path d="M280 360 C250 320, 260 280, 320 250"/>
    <path d="M320 250 C360 270, 380 300, 360 340"/>
    <path d="M280 360 C300 400, 340 420, 380 400"/>
    <path d="M240 400 C260 440, 300 460, 340 450"/>
    <path d="M320 250 C300 300, 290 330, 280 360"/>
    <path d="M360 340 C380 360, 400 370, 420 360"/>
    <path d="M340 450 C380 430, 400 400, 420 360"/>
    <path d="M280 360 C320 350, 340 340, 360 340"/>
    <!-- bridge to market path -->
    <path d="M380 400 C400 440, 420 480, 450 500"/>
  </g>

  <!-- Ascending stock signal from the mind -->
  <path d="M450 500 L510 460 L560 490 L630 400 L710 310 L780 240 L850 180"
        fill="none" stroke="#5AC8FA" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Hub nodes -->
  <g fill="#0A84FF" filter="url(#glow)">
    <circle cx="280" cy="360" r="22"/>
    <circle cx="320" cy="250" r="18"/>
    <circle cx="360" cy="340" r="24"/>
    <circle cx="240" cy="400" r="16"/>
    <circle cx="340" cy="450" r="18"/>
    <circle cx="380" cy="400" r="20"/>
    <circle cx="420" cy="360" r="20"/>
    <circle cx="300" cy="310" r="14"/>
  </g>

  <!-- Path nodes -->
  <g fill="#5AC8FA" filter="url(#glow)">
    <circle cx="450" cy="500" r="16"/>
    <circle cx="510" cy="460" r="17"/>
    <circle cx="560" cy="490" r="16"/>
    <circle cx="630" cy="400" r="19"/>
    <circle cx="710" cy="310" r="20"/>
    <circle cx="780" cy="240" r="22"/>
  </g>

  <!-- Peak insight node (AI × positive market) -->
  <circle cx="850" cy="180" r="28" fill="#30D158" filter="url(#glowGreen)"/>
  <circle cx="842" cy="172" r="10" fill="#B8FFC8" opacity="0.7"/>
</svg>
