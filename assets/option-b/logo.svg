<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="VStock option B">
  <defs>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.04  0 0 0 0 0.52  0 0 0 0 1  0 0 0 0.35 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.19  0 0 0 0 0.82  0 0 0 0 0.35  0 0 0 0.42 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.78  0 0 0 0 0.98  0 0 0 0.4 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Symmetric blue V -->
  <path d="M250 280 L512 760 L774 280"
        fill="none" stroke="#0A84FF" stroke-width="92"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glowBlue)"/>

  <!-- Ascending candlesticks in V valley -->
  <g fill="#30D158" filter="url(#glowGreen)">
    <rect x="530" y="480" width="38" height="62" rx="9"/>
    <rect x="546" y="456" width="6" height="24"/>
    <rect x="546" y="542" width="6" height="18"/>

    <rect x="600" y="380" width="42" height="92" rx="10"/>
    <rect x="618" y="352" width="6" height="28"/>
    <rect x="618" y="472" width="6" height="22"/>

    <rect x="680" y="250" width="46" height="128" rx="11"/>
    <rect x="700" y="216" width="6" height="34"/>
    <rect x="700" y="378" width="6" height="24"/>
  </g>

  <!-- Sparkline through valley -->
  <path d="M360 600 C410 550, 450 620, 510 510 S600 340, 670 250 S740 170, 790 160"
        fill="none" stroke="#5AC8FA" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glowCyan)"/>
  <circle cx="790" cy="160" r="20" fill="#5AC8FA" filter="url(#glowCyan)"/>
  <circle cx="790" cy="160" r="9" fill="#C8F0FF"/>
</svg>
