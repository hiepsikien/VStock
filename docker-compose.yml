services:
  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      VSTOCK_DB_PATH: /data/vstock.db
      PORT: "8000"
      # Companion AI (Gemini) — set one of:
      # GEMINI_API_KEY: from Google AI Studio (local / simple)
      # Or Vertex on GCE with ADC: GCP_PROJECT + GCP_LOCATION (no key in compose)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCP_LOCATION: ${GCP_LOCATION:-asia-southeast1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Shared filing window. Without this the API falls back to news_filing_days
      # in providers.yaml while research reads the variable below.
      NEWS_FILING_DAYS: ${NEWS_FILING_DAYS:-1460}
    volumes:
      - vstock-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  research:
    build:
      context: ./research
    ports:
      - "127.0.0.1:${RESEARCH_PORT:-8010}:8010"
    environment:
      PORT: "8010"
      RESEARCH_DB_PATH: /data/research.db
      VSTOCK_MARKET_DB: /market/vstock.db
      ARTICLE_RETENTION_DAYS: ${NEWS_FILING_DAYS:-1460}
      # Optional session alerts. Leave both unset to keep the operator page silent.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - research-data:/data
      - vstock-data:/market:ro
    restart: unless-stopped

volumes:
  vstock-data:
  research-data:
